<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    <title>SPEED-LEARNING CBT JAMB APP — Video Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17241f;
        background: #f6f7f3;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #748078;
        --green: #245c46;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
      }

      .topbar {
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #e6e9e2;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        color: inherit;
        font-size: clamp(12px, 3.8vw, 16px);
        font-weight: 750;
        letter-spacing: 0.2px;
        text-decoration: none;
      }

      main {
        padding: 36px 0 56px;
        text-align: center;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(26px, 5vw, 38px);
        line-height: 1.08;
        letter-spacing: -1px;
      }

      .video-card {
        overflow: hidden;
        max-width: 790px;
        margin: 0 auto;
        border: 1px solid #e7e9e3;
        border-radius: 18px;
        background: white;
        box-shadow: 0 16px 42px rgb(26 49 37 / 7%);
      }

      .video-frame {
        padding: 10px;
        background: #e9eee8;
      }

      video {
        display: block;
        width: 100%;
        max-height: 470px;
        height: auto;
        border-radius: 11px;
        background: #15241d;
        object-fit: contain;
      }

      footer {
        padding: 0 0 24px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 600px) {
        .page {
          width: min(100% - 32px, 520px);
        }

        .topbar {
          height: 66px;
        }

        main {
          padding: 28px 0 40px;
        }

        .video-frame {
          padding: 0;
        }

        .video-card {
          width: 100vw;
          margin-left: calc(50% - 50vw);
          border-right: 0;
          border-left: 0;
          border-radius: 0;
        }

        video {
          max-height: 65vh;
          max-height: 65svh;
          border-radius: 0;
        }

      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <span class="brand">SPEED-LEARNING CBT JAMB APP</span>
      </header>

      <main>
        <h1 id="page-title">Video Preview</h1>
        <article class="video-card">
          <div class="video-frame">
            <video controls playsinline preload="metadata" aria-label="SPEED-LEARNING CBT JAMB APP video preview">
              <source src="watchroom-video.mp4" type="video/mp4">
              Your browser does not support video playback.
            </video>
          </div>
        </article>
      </main>
      <footer>Created by kimjiho.dev</footer>
    </div>
  </body>
</html>
